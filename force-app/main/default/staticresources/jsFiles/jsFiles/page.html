     <script type="text/ng-template" id="myModalContent.html" >
            <div class="modal-header">
                <h4 class="modal-title" id="modal-title">When demoting a complaint to service, all opened related records will be moved to closed - cancel status</h4>
            </div>
            <div class="modal-body" id="modal-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Ticket Number</th>
                            <th>WorkFlow Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                           <td>Test</td>
                           <td>Testor</td>
                        </tr>
                    </tbody>
                </table>
                <label>Demotion Rationale</label>
                <input type="text" id="demotion" name="demotion" value=""  required="required" />
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" type="button" ng-click="$ctrl.ok()">OK</button>
                <button class="btn btn-warning" type="button" ng-click="$ctrl.cancel()">Cancel</button>
            </div>
        </script>
